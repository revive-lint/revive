name: Test
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'tools/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'test/docker/**'
      - '.github/workflows/test.yaml'
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  tests:
    name: Tests on ${{ matrix.os }} (Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        go-version:
          - oldstable
          - stable
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run tests
        run: go test -race -shuffle=on ./...
      - name: Run only benchmarks on stable Go on Ubuntu
        if: matrix.go-version == 'stable' && matrix.os == 'ubuntu-latest'
        run: go test -run=^$ -bench . -benchmem -count=1 ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          platforms: linux/amd64
          build-args: |
            VERSION=dev
            REVISION=${{ github.sha }}
            BUILDER=buildx
          push: false
          load: true
          tags: revive:ci
      - name: Smoke test image
        run: ./test/docker/smoke.sh revive:ci
